name: publish
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/publish.yml]
  schedule: [{cron: '23 5 * * 1'}]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker build --pull -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
      # A bad base or apt change must fail here, before it replaces :latest.
      - run: docker run --rm "$IMAGE:latest" sh -c 'gh --version && java -version && rsync --version'
      - run: docker push --all-tags "$IMAGE"
